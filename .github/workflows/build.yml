name: Build

on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build mod 1.21.1
        run: ./gradlew build -q

      - name: Build mod 1.21.11
        working-directory: versions/1.21.11
        run: ${{ github.workspace }}/gradlew build -q

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Build mod 26.2
        working-directory: versions/26.2
        run: ${{ github.workspace }}/gradlew build -q

      - name: Build mod 26.3
        working-directory: versions/26.3
        run: ${{ github.workspace }}/gradlew build -q

      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: |
            build/libs/*.jar
            versions/*/build/libs/*.jar
          if-no-files-found: error
